spring:
  application:
    name: learning-app
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learning_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:S+93O14n+zAHUqsPg8ZAlzG4VoIUnKANGN28TvSs6XgoDEU15/g1qmGaBIv6jMTfiyi3aXltkXnM62jJtDN/NA==}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

admin:
  email: ${ADMIN_EMAIL:admin@example.com}
  password: ${ADMIN_PASSWORD:Dangthuc02@}
  display-name: ${ADMIN_DISPLAY_NAME:Admin}

springdoc:
  swagger-ui:
    path: /docs

minio:
  url: ${MINIO_URL:http://103.176.23.198:9000}
  public-url: ${MINIO_PUBLIC_URL:http://103.176.23.198:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:StrongPassword123}
  bucket: ${MINIO_BUCKET:uploads}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

tts:
  enabled: ${TTS_ENABLED:true}
  base-url: ${TTS_BASE_URL:http://localhost:8000}
  synthesize-path: ${TTS_SYNTHESIZE_PATH:/tts}
  min-request-interval-ms: ${TTS_MIN_REQUEST_INTERVAL_MS:0}
  cooldown-seconds: ${TTS_COOLDOWN_SECONDS:30}
  default-accent: ${TTS_DEFAULT_ACCENT:us}
